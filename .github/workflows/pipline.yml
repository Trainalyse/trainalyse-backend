name: CI-CD Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  # JOB 1: Run test suite
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Run Testing Suite
        run: uv run pytest

  # JOB 2: Deploy to Cloudflare Workers
  deploy-to-cloudflare:
    runs-on: ubuntu-latest

    needs: run-tests # Only deploy if tests pass

    # restricting the job to only merge on main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install
        
      - name: Apply Database Migrations
        run: uvx --from workers-py pywrangler d1 migrations apply trainalyse-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers 
        run: uvx --from workers-py pywrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # JOB 3: Automatically handle Version Tagging & Releases
  tag-and-release:
    runs-on: ubuntu-latest

    needs: deploy-to-cloudflare # only create release if deplyed succesfully
    
    # restricting the job to only merge on main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      new_release_created: ${{ steps.check_version.outputs.is_new }}
      version_tag: ${{ steps.check_version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all tags and history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check if version is bumped
        id: check_version
        run: |
          # Safe, native parsing of pyproject.toml using standard python libraries
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "Current pyproject.toml version: v$VERSION"
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          
          # Check if the tag already exists in the repository history
          # Doesn't check if the new tag is greater. only not equal
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists. Skipping release creation."
            echo "is_new=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected! Preparing release."
            echo "is_new=true" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.check_version.outputs.is_new == 'true'
        run: |
          gh release create "${{ steps.check_version.outputs.version }}" \
            --title "Release ${{ steps.check_version.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Injected natively by GitHub
